name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml and manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          manifest_v=$(sed -n 's/.*"Version": "\(.*\)".*/\1/p' src/manifest.json | head -1)
          echo "tag=$tag Cargo.toml=$cargo_v manifest=$manifest_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$manifest_v" ]
      - name: Install system packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libudev-dev pkg-config zip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build and package
        run: |
          cargo build --release --locked
          OUT_ZIP="com.glmagalhaes.ulanzi.d200-${GITHUB_REF_NAME}-linux-x86_64.zip" bash pack.sh release
          sha256sum com.glmagalhaes.ulanzi.d200-*.zip 40-opendeck-ulanzi.rules > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v t="${GITHUB_REF_NAME#v}" '$0 ~ "^# "t" " || $0 ~ "^# "t"$" {f=1; next} /^# /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}" \
            com.glmagalhaes.ulanzi.d200-*.zip 40-opendeck-ulanzi.rules SHA256SUMS
